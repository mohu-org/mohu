# NumPy API Coverage Map for mohu
# Status values:
#   "done"       — implemented and tested
#   "partial"    — exists but missing edge cases
#   "planned"    — on the roadmap
#   "not-planned"— out of scope

[array_creation]
"np.array"          = { mohu = "mohu.array",       status = "planned" }
"np.zeros"          = { mohu = "mohu.zeros",        status = "planned" }
"np.ones"           = { mohu = "mohu.ones",         status = "planned" }
"np.empty"          = { mohu = "mohu.empty",        status = "planned" }
"np.arange"         = { mohu = "mohu.arange",       status = "planned" }
"np.linspace"       = { mohu = "mohu.linspace",     status = "planned" }
"np.eye"            = { mohu = "mohu.eye",          status = "planned" }
"np.full"           = { mohu = "mohu.full",         status = "planned" }

[array_manipulation]
"np.reshape"        = { mohu = "mohu.reshape",      status = "planned" }
"np.transpose"      = { mohu = "mohu.transpose",    status = "planned" }
"np.concatenate"    = { mohu = "mohu.concatenate",  status = "planned" }
"np.stack"          = { mohu = "mohu.stack",        status = "planned" }
"np.flatten"        = { mohu = "mohu.flatten",      status = "planned" }
