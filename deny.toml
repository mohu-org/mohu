[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "LGPL-2.1-or-later",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
ignore = [
    # pyo3 0.23 (used via mohu-error for Python bindings) has RUSTSEC-2025-0020.
    # Upgrading to pyo3 0.24+ is tracked in a separate PR.
    "RUSTSEC-2025-0020",
]
