[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "LGPL-2.1",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
ignore = [
    # pyo3 0.23.5 — buffer overflow in PyString::from_object.
    # No fix release available for 0.23.x; pin resolved once 0.24.1 ships.
    # https://rustsec.org/advisories/RUSTSEC-2025-0020
    "RUSTSEC-2025-0020",
]
