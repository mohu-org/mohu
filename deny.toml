[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
unmaintained = "all"
yanked = "deny"

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "getrandom@0.2.17", reason = "ahash via arrow depends on old version" },
  { crate = "hashbrown@0.15.5", reason = "arrow-array depends on old version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/mohu-org/mohu-compute",
  "https://github.com/mohu-org/mohu-linalg",
]
